name: Patch Wolf3D-iOS (ARMv7 + GLES2) → build IPA via clang

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-build:
    # macos-latest — любой доступный runner, clang поддерживает armv7 через -target
    runs-on: macos-latest

    steps:
      # -----------------------------------------------------------------------
      # 0. Checkout
      # -----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # 1. Определяем SDK path и проверяем clang
      # -----------------------------------------------------------------------
      - name: Setup clang + SDK info
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          SDK_VER=$(xcrun --sdk iphoneos --show-sdk-version)
          CLANG=$(xcrun --sdk iphoneos --find clang)
          echo "SDK_PATH=$SDK_PATH"     >> $GITHUB_ENV
          echo "SDK_VER=$SDK_VER"       >> $GITHUB_ENV
          echo "CLANG=$CLANG"           >> $GITHUB_ENV
          echo "✅ clang: $CLANG"
          echo "✅ SDK:   $SDK_PATH  (v$SDK_VER)"
          "$CLANG" --version

      # -----------------------------------------------------------------------
      # 2. Пишем gles_glue.h
      # -----------------------------------------------------------------------
      - name: Write gles_glue.h
        run: |
          cat > wolf3d/code/iphone/gles_glue.h << 'EOF'
          #ifndef GLES_GLUE_H
          #define GLES_GLUE_H
          #include <OpenGLES/ES2/gl.h>
          #include <OpenGLES/ES2/glext.h>
          #ifdef __cplusplus
          extern "C" {
          #endif
          void R_GLES2_Init(void);
          void R_GLES2_Shutdown(void);
          void R_GLES2_SetRenderMode(int mode);
          void R_GLES2_SetAlphaRef(float ref);
          void pfglBegin(GLenum prim);
          void pfglEnd(void);
          void pfglVertex3f(float x,float y,float z);
          void pfglVertex2f(float x,float y);
          void pfglTexCoord2f(float s,float t);
          void pfglColor4f(float r,float g,float b,float a);
          void pfglColor4ub(GLubyte r,GLubyte g,GLubyte b,GLubyte a);
          void pfglColor3f(float r,float g,float b);
          void qglMatrixMode(GLenum mode);
          void qglLoadIdentity(void);
          void qglLoadMatrixf(const float *m);
          void qglMultMatrixf(const float *m);
          void qglOrtho(float l,float r,float b,float t,float n,float f);
          void qglFrustum(float l,float r,float b,float t,float n,float f);
          void qglTranslatef(float x,float y,float z);
          void qglScalef(float x,float y,float z);
          void qglRotatef(float a,float x,float y,float z);
          void qglPushMatrix(void);
          void qglPopMatrix(void);
          void pfglEnableClientState(GLenum cap);
          void pfglDisableClientState(GLenum cap);
          void qglEnableClientState(GLenum cap);
          void qglDisableClientState(GLenum cap);
          void pfglVertexPointer(GLint s,GLenum t,GLsizei st,const void *p);
          void pfglTexCoordPointer(GLint s,GLenum t,GLsizei st,const void *p);
          void pfglColorPointer(GLint s,GLenum t,GLsizei st,const void *p);
          void qglTexEnvf(GLenum tgt,GLenum pname,GLfloat param);
          void qglTexEnvi(GLenum tgt,GLenum pname,GLint param);
          void qglAlphaFunc(GLenum func,GLclampf ref);
          #define qglBegin      pfglBegin
          #define qglEnd        pfglEnd
          #define qglVertex3f   pfglVertex3f
          #define qglVertex2f   pfglVertex2f
          #define qglTexCoord2f pfglTexCoord2f
          #define qglColor4f    pfglColor4f
          #define qglColor4ub   pfglColor4ub
          #define qglColor3f    pfglColor3f
          #ifndef GL_MODELVIEW
          #define GL_MODELVIEW  0x1700
          #endif
          #ifndef GL_PROJECTION
          #define GL_PROJECTION 0x1701
          #endif
          #ifdef __cplusplus
          }
          #endif
          #endif
          EOF

      # -----------------------------------------------------------------------
      # 3. Пишем gles_glue.c
      # -----------------------------------------------------------------------
      - name: Write gles_glue.c
        run: |
          cat > wolf3d/code/iphone/gles_glue.c << 'EOF'
          #include "gles_glue.h"
          #include <string.h>
          #include <stdio.h>
          #include <math.h>
          typedef struct { float xyz[3]; float st[2]; GLubyte c[4]; } Vertex;
          #define MAX_VERTS 16384
          static Vertex immediate[MAX_VERTS];
          static int curr_vertex=0;
          static GLenum curr_prim=GL_TRIANGLES;
          static Vertex g_cur;
          #define MAT_STACK_DEPTH 16
          typedef enum{MM_MODELVIEW=0,MM_PROJECTION=1}MatMode;
          static MatMode g_matMode=MM_MODELVIEW;
          static float g_matMV[MAT_STACK_DEPTH][16];
          static float g_matPR[MAT_STACK_DEPTH][16];
          static int g_mvDepth=0,g_prDepth=0;
          static float*CurMat(void){return(g_matMode==MM_PROJECTION)?g_matPR[g_prDepth]:g_matMV[g_mvDepth];}
          static void mat_identity(float*m){memset(m,0,64);m[0]=m[5]=m[10]=m[15]=1.f;}
          static void mat_mul(float*out,const float*a,const float*b){
            float t[16];int r,c,k;
            for(r=0;r<4;r++)for(c=0;c<4;c++){float s=0;for(k=0;k<4;k++)s+=a[r+k*4]*b[k+c*4];t[r+c*4]=s;}
            memcpy(out,t,64);}
          static GLuint g_prog=0,g_vbo=0;
          static GLint g_aPos=-1,g_aTC=-1,g_aCol=-1,g_uMVP=-1,g_uTex=-1,g_uMode=-1,g_uARef=-1;
          static const char*VERT=
            "attribute vec3 a_position;\n"
            "attribute vec2 a_texcoord;\n"
            "attribute vec4 a_color;\n"
            "uniform   mat4 u_mvpMatrix;\n"
            "varying   vec2 v_texcoord;\n"
            "varying   vec4 v_color;\n"
            "void main(){\n"
            "  gl_Position=u_mvpMatrix*vec4(a_position,1.0);\n"
            "  v_texcoord=a_texcoord;\n"
            "  v_color=a_color;\n"
            "}\n";
          static const char*FRAG=
            "precision mediump float;\n"
            "uniform sampler2D u_texture;\n"
            "uniform int u_renderMode;\n"
            "uniform float u_alphaRef;\n"
            "varying vec2 v_texcoord;\n"
            "varying vec4 v_color;\n"
            "void main(){\n"
            "  vec4 color;\n"
            "  if(u_renderMode==1){\n"
            "    color=v_color;\n"
            "  }else if(u_renderMode==2){\n"
            "    vec4 t=texture2D(u_texture,v_texcoord);\n"
            "    color=vec4(t.rgb*v_color.rgb,t.a*v_color.a);\n"
            "    if(color.a<=u_alphaRef)discard;\n"
            "  }else{\n"
            "    color=texture2D(u_texture,v_texcoord)*v_color;\n"
            "  }\n"
            "  gl_FragColor=color;\n"
            "}\n";
          static GLuint mk_shader(GLenum t,const char*src){
            GLuint s=glCreateShader(t);
            glShaderSource(s,1,&src,NULL);glCompileShader(s);
            GLint ok=0;glGetShaderiv(s,GL_COMPILE_STATUS,&ok);
            if(!ok){char l[512];glGetShaderInfoLog(s,512,NULL,l);printf("Shader:%s\n",l);}
            return s;}
          void R_GLES2_Init(void){
            GLuint vs=mk_shader(GL_VERTEX_SHADER,VERT);
            GLuint fs=mk_shader(GL_FRAGMENT_SHADER,FRAG);
            g_prog=glCreateProgram();
            glAttachShader(g_prog,vs);glAttachShader(g_prog,fs);
            glBindAttribLocation(g_prog,0,"a_position");
            glBindAttribLocation(g_prog,1,"a_texcoord");
            glBindAttribLocation(g_prog,2,"a_color");
            glLinkProgram(g_prog);glDeleteShader(vs);glDeleteShader(fs);
            glUseProgram(g_prog);
            g_aPos=glGetAttribLocation(g_prog,"a_position");
            g_aTC=glGetAttribLocation(g_prog,"a_texcoord");
            g_aCol=glGetAttribLocation(g_prog,"a_color");
            g_uMVP=glGetUniformLocation(g_prog,"u_mvpMatrix");
            g_uTex=glGetUniformLocation(g_prog,"u_texture");
            g_uMode=glGetUniformLocation(g_prog,"u_renderMode");
            g_uARef=glGetUniformLocation(g_prog,"u_alphaRef");
            glUniform1i(g_uTex,0);glUniform1i(g_uMode,0);glUniform1f(g_uARef,0.f);
            glGenBuffers(1,&g_vbo);
            glBindBuffer(GL_ARRAY_BUFFER,g_vbo);
            glBufferData(GL_ARRAY_BUFFER,sizeof(immediate),NULL,GL_DYNAMIC_DRAW);
            glBindBuffer(GL_ARRAY_BUFFER,0);
            mat_identity(g_matMV[0]);mat_identity(g_matPR[0]);
            g_mvDepth=g_prDepth=0;
            g_cur.c[0]=g_cur.c[1]=g_cur.c[2]=g_cur.c[3]=255;}
          void R_GLES2_Shutdown(void){
            if(g_vbo){glDeleteBuffers(1,&g_vbo);g_vbo=0;}
            if(g_prog){glDeleteProgram(g_prog);g_prog=0;}}
          void R_GLES2_SetRenderMode(int m){glUniform1i(g_uMode,m);}
          void R_GLES2_SetAlphaRef(float r){glUniform1f(g_uARef,r);}
          static void upload_mvp(void){
            float mvp[16];mat_mul(mvp,g_matPR[g_prDepth],g_matMV[g_mvDepth]);
            glUniformMatrix4fv(g_uMVP,1,GL_FALSE,mvp);}
          void pfglBegin(GLenum p){curr_vertex=0;curr_prim=p;}
          void pfglEnd(void){
            if(!curr_vertex)return;
            upload_mvp();
            glBindBuffer(GL_ARRAY_BUFFER,g_vbo);
            glBufferSubData(GL_ARRAY_BUFFER,0,curr_vertex*sizeof(Vertex),immediate);
            glEnableVertexAttribArray(g_aPos);
            glEnableVertexAttribArray(g_aTC);
            glEnableVertexAttribArray(g_aCol);
            glVertexAttribPointer(g_aPos,3,GL_FLOAT,GL_FALSE,sizeof(Vertex),(void*)0);
            glVertexAttribPointer(g_aTC,2,GL_FLOAT,GL_FALSE,sizeof(Vertex),(void*)12);
            glVertexAttribPointer(g_aCol,4,GL_UNSIGNED_BYTE,GL_TRUE,sizeof(Vertex),(void*)20);
            glDrawArrays(curr_prim,0,curr_vertex);
            glDisableVertexAttribArray(g_aPos);
            glDisableVertexAttribArray(g_aTC);
            glDisableVertexAttribArray(g_aCol);
            glBindBuffer(GL_ARRAY_BUFFER,0);
            curr_vertex=0;}
          void pfglTexCoord2f(float s,float t){g_cur.st[0]=s;g_cur.st[1]=t;}
          void pfglVertex3f(float x,float y,float z){
            if(curr_vertex>=MAX_VERTS)return;
            g_cur.xyz[0]=x;g_cur.xyz[1]=y;g_cur.xyz[2]=z;
            immediate[curr_vertex++]=g_cur;}
          void pfglVertex2f(float x,float y){pfglVertex3f(x,y,0.f);}
          void pfglColor4f(float r,float g,float b,float a){
            g_cur.c[0]=(GLubyte)(r*255);g_cur.c[1]=(GLubyte)(g*255);
            g_cur.c[2]=(GLubyte)(b*255);g_cur.c[3]=(GLubyte)(a*255);}
          void pfglColor4ub(GLubyte r,GLubyte g,GLubyte b,GLubyte a){
            g_cur.c[0]=r;g_cur.c[1]=g;g_cur.c[2]=b;g_cur.c[3]=a;}
          void pfglColor3f(float r,float g,float b){pfglColor4f(r,g,b,1.f);}
          void qglMatrixMode(GLenum m){g_matMode=(m==GL_PROJECTION)?MM_PROJECTION:MM_MODELVIEW;}
          void qglLoadIdentity(void){mat_identity(CurMat());}
          void qglLoadMatrixf(const float*m){memcpy(CurMat(),m,64);}
          void qglMultMatrixf(const float*m){float*c=CurMat(),t[16];memcpy(t,c,64);mat_mul(c,t,m);}
          void qglOrtho(float l,float r,float b,float t,float n,float f){
            float m[16]={0};
            m[0]=2.f/(r-l);m[5]=2.f/(t-b);m[10]=-2.f/(f-n);
            m[12]=-(r+l)/(r-l);m[13]=-(t+b)/(t-b);m[14]=-(f+n)/(f-n);m[15]=1.f;
            qglMultMatrixf(m);}
          void qglFrustum(float l,float r,float b,float t,float n,float f){
            float m[16]={0};
            m[0]=(2.f*n)/(r-l);m[5]=(2.f*n)/(t-b);
            m[8]=(r+l)/(r-l);m[9]=(t+b)/(t-b);
            m[10]=-(f+n)/(f-n);m[11]=-1.f;m[14]=-(2.f*f*n)/(f-n);
            qglMultMatrixf(m);}
          void qglTranslatef(float x,float y,float z){
            float m[16];mat_identity(m);m[12]=x;m[13]=y;m[14]=z;qglMultMatrixf(m);}
          void qglScalef(float x,float y,float z){
            float m[16];mat_identity(m);m[0]=x;m[5]=y;m[10]=z;qglMultMatrixf(m);}
          void qglRotatef(float a,float x,float y,float z){
            float len=sqrtf(x*x+y*y+z*z);if(!len)return;
            x/=len;y/=len;z/=len;
            float rad=a*3.14159265f/180.f,c=cosf(rad),s=sinf(rad),ic=1.f-c;
            float m[16]={0};
            m[0]=x*x*ic+c;m[1]=y*x*ic+z*s;m[2]=z*x*ic-y*s;
            m[4]=x*y*ic-z*s;m[5]=y*y*ic+c;m[6]=z*y*ic+x*s;
            m[8]=x*z*ic+y*s;m[9]=y*z*ic-x*s;m[10]=z*z*ic+c;m[15]=1.f;
            qglMultMatrixf(m);}
          void qglPushMatrix(void){
            if(g_matMode==MM_PROJECTION){
              if(g_prDepth<MAT_STACK_DEPTH-1){memcpy(g_matPR[g_prDepth+1],g_matPR[g_prDepth],64);g_prDepth++;}}
            else{if(g_mvDepth<MAT_STACK_DEPTH-1){memcpy(g_matMV[g_mvDepth+1],g_matMV[g_mvDepth],64);g_mvDepth++;}}}
          void qglPopMatrix(void){
            if(g_matMode==MM_PROJECTION){if(g_prDepth>0)g_prDepth--;}
            else{if(g_mvDepth>0)g_mvDepth--;}}
          void pfglEnableClientState(GLenum c){(void)c;}
          void pfglDisableClientState(GLenum c){(void)c;}
          void qglEnableClientState(GLenum c){(void)c;}
          void qglDisableClientState(GLenum c){(void)c;}
          void pfglVertexPointer(GLint s,GLenum t,GLsizei st,const void*p){(void)s;(void)t;(void)st;(void)p;}
          void pfglTexCoordPointer(GLint s,GLenum t,GLsizei st,const void*p){(void)s;(void)t;(void)st;(void)p;}
          void pfglColorPointer(GLint s,GLenum t,GLsizei st,const void*p){(void)s;(void)t;(void)st;(void)p;}
          void qglTexEnvf(GLenum a,GLenum b,GLfloat c){(void)a;(void)b;(void)c;}
          void qglTexEnvi(GLenum a,GLenum b,GLint c){(void)a;(void)b;(void)c;}
          void qglAlphaFunc(GLenum f,GLclampf r){R_GLES2_SetAlphaRef((f==GL_GREATER)?r:0.f);}
          EOF

      # -----------------------------------------------------------------------
      # 4. Патчим EAGLView и renderer sources (ES1 → ES2)
      # -----------------------------------------------------------------------
      - name: Patch EAGLView and renderer sources
        run: |
          # EAGLView.m — ES1 → ES2
          F="wolf3d/code/iphone/EAGLView.m"
          perl -i -pe '
            s/kEAGLRenderingAPIOpenGLES1/kEAGLRenderingAPIOpenGLES2/g;
            s|<OpenGLES/ES1/gl\.h>|<OpenGLES/ES2/gl.h>|g;
            s|<OpenGLES/ES1/glext\.h>|<OpenGLES/ES2/glext.h>|g;
          ' "$F"
          python3 -c "
          path='wolf3d/code/iphone/EAGLView.m'
          with open(path,'r') as f: src=f.read()
          if 'gles_glue.h' not in src: src='#include \"gles_glue.h\"\n'+src
          if 'R_GLES2_Init' not in src:
              src=src.replace('[EAGLContext setCurrentContext:context];',
                  '[EAGLContext setCurrentContext:context];\n\tR_GLES2_Init();')
          with open(path,'w') as f: f.write(src)
          "

          # EAGLView.h
          perl -i -pe '
            s|<OpenGLES/ES1/gl\.h>|<OpenGLES/ES2/gl.h>|g;
            s|<OpenGLES/ES1/glext\.h>|<OpenGLES/ES2/glext.h>|g;
            s/kEAGLRenderingAPIOpenGLES1/kEAGLRenderingAPIOpenGLES2/g;
          ' wolf3d/code/iphone/EAGLView.h

          # Renderer sources
          for f in \
            wolf3d/code/env/opengl_main.c \
            wolf3d/code/env/opengl_draw.c \
            wolf3d/code/env/opengl_texture.c \
            wolf3d/code/wolf/wolf_renderer.c \
            wolf3d/code/iphone/wolf_opengl.c; do
            [ -f "$f" ] || continue
            perl -i -pe '
              s|<OpenGLES/ES1/gl\.h>|<OpenGLES/ES2/gl.h>|g;
              s|<OpenGLES/ES1/glext\.h>|<OpenGLES/ES2/glext.h>|g;
            ' "$f"
            python3 -c "
          path='$f'
          with open(path,'r') as fh: src=fh.read()
          if 'gles_glue.h' not in src:
              src='#include \"gles_glue.h\"\n'+src
              with open(path,'w') as fh: fh.write(src)
            "
          done

          # Render modes
          python3 - <<'PYEOF'
          import re
          path = "wolf3d/code/env/opengl_draw.c"
          try:
              with open(path,"r") as f: src=f.read()
              if "R_GLES2_SetRenderMode(1)" not in src:
                  def pf(m):
                      b=m.group(0)
                      if "R_GLES2_SetRenderMode" not in b:
                          b=b.replace("pfglBegin(","R_GLES2_SetRenderMode(1);\n\tpfglBegin(",1)
                          b=b.replace("pfglEnd();","pfglEnd();\n\tR_GLES2_SetRenderMode(0);",1)
                      return b
                  src=re.sub(r'(void R_Draw_Fill\s*\([^)]*\)\s*\{[^}]*\})',pf,src,flags=re.DOTALL)
                  with open(path,"w") as f: f.write(src)
          except: pass
          path = "wolf3d/code/wolf/wolf_renderer.c"
          try:
              with open(path,"r") as f: src=f.read()
              if "R_GLES2_SetRenderMode(2)" not in src:
                  src=src.replace("glEnable( GL_BLEND );",
                      "glEnable( GL_BLEND );\n\tR_GLES2_SetRenderMode(2);\n\tR_GLES2_SetAlphaRef(0.1f);")
                  src=src.replace("glDisable( GL_BLEND );",
                      "glDisable( GL_BLEND );\n\tR_GLES2_SetRenderMode(0);\n\tR_GLES2_SetAlphaRef(0.0f);")
                  with open(path,"w") as f: f.write(src)
          except: pass
          PYEOF

      # -----------------------------------------------------------------------
      # 5. Собираем список всех .c / .m исходников
      # -----------------------------------------------------------------------
      - name: Collect source files
        run: |
          # Ищем все .c и .m файлы в wolf3d/code, исключаем win32/linux/android
          find wolf3d/code -name "*.c" -o -name "*.m" \
            | grep -v -E "(win32|windows|linux|android|macosx/)" \
            | sort > /tmp/sources.txt

          echo "=== Sources found: $(wc -l < /tmp/sources.txt) ==="
          cat /tmp/sources.txt

      # -----------------------------------------------------------------------
      # 6. Компилируем через clang -target armv7-apple-ios4.3
      # -----------------------------------------------------------------------
      - name: Compile with clang (ARMv7, iOS 4.3)
        run: |
          SDK="${SDK_PATH}"
          CLANG_BIN="${CLANG}"
          TARGET="armv7-apple-ios4.3"
          OBJ_DIR="$GITHUB_WORKSPACE/build/obj"
          mkdir -p "$OBJ_DIR"

          CFLAGS=(
            -target "$TARGET"
            -isysroot "$SDK"
            -arch armv7
            -miphoneos-version-min=4.3
            -O2
            -w
            # Include paths
            -I wolf3d/code/iphone
            -I wolf3d/code/env
            -I wolf3d/code/wolf
            -I wolf3d/code/id_in
            -I wolf3d/code/id_sd
            -I wolf3d/code/id_ca
            -I wolf3d/code/id_us
            # Frameworks
            -F "$SDK/System/Library/Frameworks"
            # Defines
            -DIPHONE
            -DGLES2
            -DGL_SILENCE_DEPRECATION
          )

          FAILED=0
          while IFS= read -r src; do
            obj="$OBJ_DIR/$(echo "$src" | tr '/' '_').o"
            echo "Compiling: $src"
            "$CLANG_BIN" "${CFLAGS[@]}" -c "$src" -o "$obj" || {
              echo "❌ FAILED: $src"
              FAILED=$((FAILED+1))
            }
          done < /tmp/sources.txt

          echo "=== Compile done. Failures: $FAILED ==="
          [ "$FAILED" -eq 0 ] || exit 1

      # -----------------------------------------------------------------------
      # 7. Линкуем в .dylib / исполняемый файл
      # -----------------------------------------------------------------------
      - name: Link
        run: |
          SDK="${SDK_PATH}"
          CLANG_BIN="${CLANG}"
          TARGET="armv7-apple-ios4.3"
          OBJ_DIR="$GITHUB_WORKSPACE/build/obj"
          OUT="$GITHUB_WORKSPACE/build/Wolf3D"

          LDFLAGS=(
            -target "$TARGET"
            -isysroot "$SDK"
            -arch armv7
            -miphoneos-version-min=4.3
            # Frameworks нужные Wolf3D
            -framework Foundation
            -framework UIKit
            -framework OpenGLES
            -framework QuartzCore
            -framework AudioToolbox
            -framework AVFoundation
            -lz -lm
          )

          OBJS=("$OBJ_DIR"/*.o)
          echo "=== Linking ${#OBJS[@]} objects ==="
          "$CLANG_BIN" "${LDFLAGS[@]}" "${OBJS[@]}" -o "$OUT"
          echo "✅ Linked: $OUT"
          file "$OUT"

      # -----------------------------------------------------------------------
      # 8. Собираем .app bundle вручную
      # -----------------------------------------------------------------------
      - name: Assemble .app bundle
        run: |
          BUILD_DIR="$GITHUB_WORKSPACE/build"
          APP_DIR="$BUILD_DIR/Wolf3D.app"
          mkdir -p "$APP_DIR"

          # Бинарник
          cp "$BUILD_DIR/Wolf3D" "$APP_DIR/Wolf3D"
          chmod +x "$APP_DIR/Wolf3D"

          # Копируем ресурсы если есть
          for res_dir in \
            wolf3d/base \
            wolf3d/res \
            wolf3d/resources \
            wolf3d/data; do
            [ -d "$res_dir" ] && cp -R "$res_dir/"* "$APP_DIR/" 2>/dev/null || true
          done

          # Минимальный Info.plist
          cat > "$APP_DIR/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleIdentifier</key>
            <string>com.idsoftware.wolf3d</string>
            <key>CFBundleExecutable</key>
            <string>Wolf3D</string>
            <key>CFBundleName</key>
            <string>Wolfenstein 3D</string>
            <key>CFBundleVersion</key>
            <string>1.0</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>MinimumOSVersion</key>
            <string>4.3</string>
            <key>UIRequiredDeviceCapabilities</key>
            <array><string>armv7</string></array>
            <key>UISupportedInterfaceOrientations</key>
            <array>
              <string>UIInterfaceOrientationLandscapeLeft</string>
              <string>UIInterfaceOrientationLandscapeRight</string>
            </array>
          </dict>
          </plist>
          PLIST

          echo "✅ App bundle: $APP_DIR"
          ls -la "$APP_DIR"

      # -----------------------------------------------------------------------
      # 9. Пакуем .ipa
      # -----------------------------------------------------------------------
      - name: Package .ipa
        id: ipa
        run: |
          BUILD_DIR="$GITHUB_WORKSPACE/build"
          IPA_DIR="$BUILD_DIR/ipa_staging"
          mkdir -p "$IPA_DIR/Payload"
          cp -R "$BUILD_DIR/Wolf3D.app" "$IPA_DIR/Payload/"

          IPA_PATH="$BUILD_DIR/Wolf3D_armv7_ios43_unsigned.ipa"
          cd "$IPA_DIR" && zip -qr "$IPA_PATH" Payload/

          echo "ipa_path=$IPA_PATH" >> $GITHUB_OUTPUT
          echo "ipa_name=Wolf3D_armv7_ios43_unsigned.ipa" >> $GITHUB_OUTPUT
          echo "✅ IPA: $IPA_PATH ($(du -sh $IPA_PATH | cut -f1))"

      # -----------------------------------------------------------------------
      # 10. Коммитим исходники
      # -----------------------------------------------------------------------
      - name: Commit patched sources
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            wolf3d/code/iphone/wolf3d.xcodeproj/project.pbxproj \
            wolf3d/code/iphone/EAGLView.m \
            wolf3d/code/iphone/EAGLView.h \
            wolf3d/code/iphone/gles_glue.c \
            wolf3d/code/iphone/gles_glue.h 2>/dev/null || true

          for f in \
            wolf3d/code/env/opengl_main.c \
            wolf3d/code/env/opengl_draw.c \
            wolf3d/code/env/opengl_texture.c \
            wolf3d/code/wolf/wolf_renderer.c \
            wolf3d/code/iphone/wolf_opengl.c; do
            git add "$f" 2>/dev/null || true
          done

          git diff --cached --quiet && echo "Nothing to commit" || \
          git commit -m "feat: ARMv7 + GLES2 patch (clang direct build)"
          git push origin HEAD:${{ github.ref_name }}

      # -----------------------------------------------------------------------
      # 11. Upload artifact
      # -----------------------------------------------------------------------
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wolf3D-armv7-ios43-unsigned
          path: ${{ steps.ipa.outputs.ipa_path }}
          retention-days: 30

      # -----------------------------------------------------------------------
      # 12. Commit IPA + GitHub Release
      # -----------------------------------------------------------------------
      - name: Commit IPA to repo
        run: |
          mkdir -p release
          cp "${{ steps.ipa.outputs.ipa_path }}" "release/${{ steps.ipa.outputs.ipa_name }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "release/${{ steps.ipa.outputs.ipa_name }}"
          git diff --cached --quiet && echo "IPA already committed" || \
          git commit -m "release: ${{ steps.ipa.outputs.ipa_name }}"
          git push origin HEAD:${{ github.ref_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: armv7-gles2-ios43
          name: "Wolf3D-iOS ARMv7 + GLES2 + iOS 4.3 (unsigned)"
          body: |
            ## Wolf3D-iOS — ARMv7 + OpenGL ES 2.0, deployment target iOS 4.3

            **Unsigned IPA** — установить через Sideloadly / AltStore / Filza (jailbreak)

            ### Изменения
            - Собрано напрямую через `clang -target armv7-apple-ios4.3`
            - Без зависимости от старого Xcode или SDK
            - OpenGL ES 1.1 → ES 2.0 (gles_glue shim)
            - `macos-latest` runner

            ### Установка
            - **Sideloadly**: перетащи .ipa, введи Apple ID
            - **AltStore**: импорт через Files
            - **Jailbreak**: Filza → `/var/mobile/...`
          files: ${{ steps.ipa.outputs.ipa_path }}
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
